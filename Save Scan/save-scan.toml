# Save Scan: reads every saved item when another plugin (or the console command savescan)
# asks which items hold a stat. It does nothing otherwise and has no settings.
# Saves are read, and rewritten only when a plugin asks for it (fixSaves: a stat removed, renumbered
# or resized), after a dated backup in d2rloader\live-suite\save-scan\<mod>\backup-<date>.
# Also written on request: d2rloader\live-suite\save-scan\<mod>\items.txt
